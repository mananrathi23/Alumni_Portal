# ── alumni-portal Nginx reverse proxy + load balancer ─────────────────────────
# Place this at nginx/nginx.conf
#
# Upstream: two backend API replicas. Nginx uses round-robin by default.
# Sticky sessions are NOT needed because:
#   - JWT is stateless (stored in cookie)
#   - Socket.io uses the Redis adapter, so events are cross-instance
#   - Rate-limit counters are in Redis, not in-process
# ---------------------------------------------------------------------------

worker_processes auto;                 # One worker per CPU core

events {
    worker_connections 2048;           # Max simultaneous connections per worker
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length    1024;

    # ── Security headers set by Nginx ─────────────────────────────────────
    server_tokens      off;                        # Don't expose Nginx version

    # ── Upstream backends (Docker Compose service name + replicas) ─────────
    upstream backend_pool {
        least_conn;                                # Route to the least busy replica
        server backend:4000;                       # Docker Compose will resolve to all replicas
        keepalive 32;                              # Reuse connections to backend
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge through
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS reverse proxy + load balancer ──────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # ── SSL / TLS ─────────────────────────────────────────────────────
        # Let's Encrypt cert, issued with --cert-name api by deploy/init-letsencrypt.sh
        ssl_certificate     /etc/letsencrypt/live/api/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Additional security headers ────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"  always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Client request limits ─────────────────────────────────────────
        client_max_body_size 10m;

        # ── Proxy all API traffic ─────────────────────────────────────────
        location /api/ {
            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;

            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Socket.io — WebSocket upgrade ─────────────────────────────────
        location /socket.io/ {
            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;

            # These two headers are REQUIRED for WebSocket upgrade
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        "upgrade";

            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # Longer timeout for long-lived WS connections
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── OAuth callback passthrough ─────────────────────────────────────
        location /auth/ {
            proxy_pass          http://backend_pool;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # ── Health probe (used by Uptime Kuma) ────────────────────────────
        location /health {
            proxy_pass          http://backend_pool/api/v1/health;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            access_log          off;
        }
    }
}
